name: keepalive
# GitHub disables scheduled workflows after 60 days with no repository activity.
# This commits a heartbeat every ~25 days so oci-grab keeps hunting indefinitely.
on:
  schedule:
    - cron: "11 4 */25 * *"
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - '.github/workflows/keepalive.yml'
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%FT%TZ" > .keepalive
          git config user.name  "ftbc-bot"
          git config user.email "ftbc-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive" || exit 0
          git push
